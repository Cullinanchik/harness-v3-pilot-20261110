name: Synthetic pilot CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
